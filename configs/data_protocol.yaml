# Data Protocol and Benchmark Specification
# IEEE ICC 2027 Mobile and Wireless Networks Track
# Project: Agentic Temporal KAN for Joint Telemetry Acquisition and QoS-Constrained RAN Slicing

protocol_version: "1.0.0"
audit_date: "2026-10-24"
random_seed: 2026

dataset:
  name: "Colosseum O-RAN COMMAG Dataset"
  source_root: "data/raw/commag"
  dataset_type: "slice_traffic"
  base_scenario: "rome_static_close"
  ood_scenario: "rome_slow_close"

sampling:
  timestamp_field: "Timestamp"
  timestamp_unit: "milliseconds (Unix epoch)"
  sampling_interval_ms: 250.0
  sampling_frequency_hz: 4.0
  interval_tolerance_ms: 5.0

forecasting_task:
  target:
    name: "dl_buffer [bytes]"
    field_in_csv: "dl_buffer [bytes]"
    measurement_type: "direct_measurement"
    physical_unit: "bytes"
    semantic: "Downlink RLC/MAC queue buffer backlog waiting for transmission"
    is_packet_delay: false
    definition: "y(t+1) is the buffer value at the next consecutive sample for the same UE, slice, and independent recording"
  
  parameters:
    lookback_window_steps: 16          # 16 samples * 250 ms = 4.0 seconds
    forecast_horizon_steps: 1          # 1 sample * 250 ms = 0.25 seconds
    step_duration_sec: 0.25

  inputs:
    - name: "dl_buffer [bytes]"
      dtype: "float64"
      unit: "bytes"
      availability: "available at or before step t (measured at close of 250 ms window)"
    - name: "tx_brate downlink [Mbps]"
      dtype: "float64"
      unit: "Mbps"
      availability: "available at or before step t (physical transmitted bitrate in window)"
    - name: "sum_requested_prbs"
      dtype: "float64"
      unit: "count"
      availability: "available at or before step t (cumulative PRBs requested in window)"
    - name: "sum_granted_prbs"
      dtype: "float64"
      unit: "count"
      availability: "available at or before step t (cumulative PRBs granted by scheduler in window)"

  grouping_variable:
    name: "slice_id"
    dtype: "int64"
    categories:
      0: "eMBB (Enhanced Mobile Broadband - 1 Mbps CBR traffic)"
      1: "MTC (Machine-Type Communications - 30 pkt/s, 125 bytes)"
      2: "URLLC (Ultra-Reliable Low-Latency - 10 pkt/s, 125 bytes)"
    handling: "Model sequences per slice separately or use categorical slice conditioning; never treat slice_id as a continuous scalar."

leakage_prevention:
  partitioning_strategy: "independent_experiment_group_split"
  split_ratios:
    train: 0.714  # 10 runs (approx 70%)
    val: 0.143    # 2 runs (approx 15%)
    test: 0.143   # 2 runs (approx 15%)
  
  windowing_constraints:
    - "Temporal sliding windows (lookback=16, horizon=1) are generated strictly AFTER assigning independent runs to splits."
    - "No window may span across distinct UE sequences, base stations, or experiments."
    - "Imputation statistics, scalers, and normalizers must be fit on the training split ONLY."

